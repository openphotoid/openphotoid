# Builds every installable surface on a `v*` tag — a release candidate is
# `vX.Y.Z-rc.N` and this workflow is what makes it real: a tag with no
# files attached is a signpost to nothing. Also runnable from the Actions
# tab with a version, so cutting a release needs no terminal.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. v0.1.0-rc.1); must already exist"
        required: true
env:
  VERSION: ${{ inputs.version || github.ref_name }}
  CARGO_TERM_COLOR: always
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.version || github.ref_name }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android, wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: pip3 install onnx
      - run: npm --prefix apps/webapp ci && npm --prefix apps/mobile ci
      - run: bash apps/webapp/scripts/fetch-models.sh
      - run: python3 scripts/patch-modnet-for-tract.py .vendor/models/modnet_photographic_portrait_matting.onnx .vendor/models/modnet_photographic_portrait_matting.tract.onnx
      # gen/android is committed (it carries the insets fix in MainActivity
      # and the theme), so there is no init step: the build uses it as is.
      - run: npm --prefix apps/mobile run android:build
        env: { NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/27.0.12077973" }
      # Gradle leaves the release APK unsigned; a phone refuses to install
      # that. Debug-sign it with a throwaway key so the RC installs. The
      # Play upload key is a different, permanent key and is never in CI.
      - run: |
          mkdir -p dist
          bt="$ANDROID_HOME/build-tools/35.0.0"
          apk=$(find apps/mobile/src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "dist/OpenPhotoId-${VERSION}.apk" aligned.apk
          "$bt/apksigner" verify "dist/OpenPhotoId-${VERSION}.apk"
          (cd dist && sha256sum "OpenPhotoId-${VERSION}.apk" > "OpenPhotoId-${VERSION}.apk.sha256")   # bare name, so `shasum -c` works on a download
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.version || github.ref_name }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios, wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: brew install binaryen && pip3 install --break-system-packages onnx
      - run: npm --prefix apps/webapp ci && npm --prefix apps/mobile ci
      - run: bash apps/webapp/scripts/fetch-models.sh
      - run: python3 scripts/patch-modnet-for-tract.py .vendor/models/modnet_photographic_portrait_matting.onnx .vendor/models/modnet_photographic_portrait_matting.tract.onnx
      # gen/apple is committed too; no init step.
      # Unsigned: no team, no provisioning. `--no-sign --archive-only` is the
      # CLI's own way to archive without a team (a bare xcodebuild cannot be
      # used instead: the project's "Build Rust Code" phase talks back to
      # the CLI over a socket). The .app inside the archive is what a store
      # submission signs later; zipped as Payload/ it is an .ipa by structure.
      - run: |
          cd apps/mobile
          node_modules/.bin/tauri ios build --target aarch64 --no-sign --archive-only
          cd src-tauri/gen/apple/build
          mkdir -p Payload && cp -R openphotoid-mobile_iOS.xcarchive/Products/Applications/OpenPhotoId.app Payload/
          mkdir -p "$GITHUB_WORKSPACE/dist" && zip -qr "$GITHUB_WORKSPACE/dist/OpenPhotoId-${VERSION}-unsigned.ipa" Payload
          (cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 "OpenPhotoId-${VERSION}-unsigned.ipa" > "OpenPhotoId-${VERSION}-unsigned.ipa.sha256")
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/ }
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-15
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.version || github.ref_name }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
  release:
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.version || github.ref_name }}" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f | sort
      # --prerelease: an RC must never become the "Latest" download.
      - run: |
          files=$(find artifacts -type f \( -name "*.apk" -o -name "*.sha256" -o -name "*.ipa" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) | tr '\n' ' ')
          gh release create "$VERSION" $files --prerelease --title "OpenPhotoId $VERSION" --notes-file .github/release-notes.md --repo "$GITHUB_REPOSITORY" || gh release upload "$VERSION" $files --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: "${{ github.token }}" }
